<style>
  :root {
    --bg: #F8F8FA;
    --surface: #FFFFFF;
    --text: #0F1115;
    --muted: #525866;
    --accent: #002BFF;
    --accent-hover: #0022CC;
    --border: #E4E6EC;
    --glow: rgba(0, 43, 255, 0.08);
    --shadow: 0 24px 48px -12px rgba(15, 17, 21, 0.16);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A0C10;
      --surface: #131720;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --accent: #4D6BFF;
      --accent-hover: #6B84FF;
      --border: #232834;
      --glow: rgba(77, 107, 255, 0.14);
      --shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
    }
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 12% 18%, var(--glow) 0%, transparent 45%);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    flex: 1;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 28px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 48px;
  }

  .hero {
    margin: auto 0;
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    align-items: center;
    gap: 56px;
  }

  h1 {
    margin: 0 0 20px;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: clamp(2.8rem, 5.5vw, 4.25rem);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.03em;
  }

  .intro {
    margin: 0 0 32px;
    max-width: 44ch;
    color: var(--muted);
    font-size: 19px;
    line-height: 1.65;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  .btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .btn-primary {
    background: var(--accent);
    color: #FFFFFF;
    box-shadow: 0 8px 20px -6px rgba(0, 43, 255, 0.45);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
  }

  .media {
    margin: 0;
  }

  .media img {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 520px;
    height: auto;
    margin: 0 auto;
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  footer {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
  }

  footer p {
    margin: 0;
  }

  @media (max-width: 820px) {
    .wrap {
      padding: 32px 20px 28px;
      gap: 36px;
    }
    .hero {
      grid-template-columns: 1fr;
      gap: 32px;
    }
    .media {
      order: -1;
    }
    .intro {
      font-size: 17px;
      margin-bottom: 24px;
    }
  }
</style>
</head>

    <script>
      (function () {
        var photos = [
          { src: "joeleyba-soccer.webp", alt: "Juninho running through tactics on the pitch" },
          { src: "joeleyba-soccer-2.webp", alt: "Joe Leyba playing soccer in an LA Galaxy jersey" },

          { src: "joeleyba-old.webp", alt: "Joe Leyba" },
          { src: "joeleyba-old2.webp", alt: "Joe Leyba" }
        ];
        var last = -1;
        try { last = parseInt(sessionStorage.getItem("lastPhoto") || "-1", 10); } catch (e) {}
        var idx = Math.floor(Math.random() * photos.length);
        if (photos.length > 1 && idx === last) {
          idx = (idx + 1 + Math.floor(Math.random() * (photos.length - 1))) % photos.length;
        }
        try { sessionStorage.setItem("lastPhoto", String(idx)); } catch (e) {}
        var pick = photos[idx];
        var img = document.getElementById("hero-img");
        img.src = pick.src;
        img.alt = pick.alt;
      })();
    </script>
